name: nOrMaL Auto Release

on:
  push:
    branches:
      - nOrMaL   # Trigger on push to normal
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  build-and-release:
    runs-on: windows-latest

    env:
      REPO: ${{ github.repository }}

    permissions:
      contents: write # Required to create the release and tag

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Version by DateTime
        id: set_version
        shell: pwsh
        run: |
          Write-Host "Setting version based on current date and time..."
          $dt = Get-Date -Format "yyyyMMdd-HHmmss"
          $version = "v$dt-nOrMaL"
          Write-Host "Generated version: $version"
          echo "VERSION=$version" >> $GITHUB_ENV
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create Tag
        shell: pwsh
        run: |
          Write-Host "Configuring Git user..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          Write-Host "Creating Git tag $env:VERSION..."
          git tag $env:VERSION
          Write-Host "Pushing Git tag $env:VERSION to origin..."
          git push origin $env:VERSION
          Write-Host "Tag pushed successfully."

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore Dependencies
        run: |
          Write-Host "Restoring .NET dependencies..."
          dotnet restore

      - name: Build and Publish
        run: |
          Write-Host "Building and publishing project..."
          dotnet publish -c Release -r win-x64 --self-contained false -o ./publish
          Write-Host "Build and publish complete."

      - name: Zip Build Output
        shell: pwsh
        run: |
          Write-Host "Zipping build output..."
          Compress-Archive -Path ./publish/* -DestinationPath "./Star-Resonance-Dps-$env:VERSION.zip"
          Write-Host "Zip created: Star-Resonance-Dps-$env:VERSION.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.set_version.outputs.version }}
          name: Release ${{ steps.set_version.outputs.version }}
          files: ./Star-Resonance-Dps-${{ steps.set_version.outputs.version }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Logging wrapper
        # softprops/action-gh-release doesn't have verbose mode, so we wrap in a logging step

      - name: Log Release Creation
        shell: pwsh
        run: |
          Write-Host "Release creation requested for tag: $env:VERSION"
          Write-Host "Release file: Star-Resonance-Dps-$env:VERSION.zip"
          Write-Host "Check GitHub Actions logs to verify release creation."

      - name: Generate latest-release.md
        shell: pwsh
        run: |
          Write-Host "Generating latest-release.md..."
          $release_url = "https://github.com/$($env:REPO)/releases/tag/$($env:VERSION)"
          $zip_url = "https://github.com/$($env:REPO)/releases/download/$($env:VERSION)/Star-Resonance-Dps-$($env:VERSION).zip"

          Write-Host "Fetching last 5 commits..."
          $commits = git log -n 5 --pretty=format:'- %h %s by %an'
          Write-Host $commits

          $lines = @(
            "# Latest Release - $($env:VERSION)"
            ""
            "**Release Tag:** [$($env:VERSION)]($release_url)"
            "**File Name:** [Star-Resonance-Dps-$($env:VERSION).zip]($zip_url)"
            "**Release Notes:** See release page for full notes."
            ""
            "## Last Commits"
            "$commits"
            ""
            "## Installation"
            "1. Download the [zip file]($zip_url)"
            "2. Extract contents"
            "3. Run `Star-Resonance-Dps.exe` (Windows)"
            ""
            "## Action"
            "This release was created automatically via GitHub Actions."
          )

          $lines | Out-File -FilePath latest-release.md -Encoding UTF8
          Write-Host "latest-release.md generated successfully:"
          Get-Content latest-release.md | ForEach-Object { Write-Host $_ }

      - name: Commit latest-release.md
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update latest-release.md for ${{ steps.set_version.outputs.version }}"
          file_pattern: latest-release.md
          branch: nOrMaL
        # Add log
      - name: Log Commit
        shell: pwsh
        run: |
          Write-Host "latest-release.md committed to branch nOrMaL"
          Write-Host "Commit message: Update latest-release.md for $($env:VERSION)"
