name: nOrMaL Auto Release

on:
  push:
    branches:
      - nOrMaL   # Trigger on push to normal
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  build-and-release:
    runs-on: windows-latest
    
    env:
      VERSION: v${{ github.run_number }}-nOrMaL   # <<< Store version ONCE
      REPO: ${{ github.repository }}
      ZIP_FILE: Star-Resonance-Dps-${{ github.run_number }}-nOrMaL.zip

    permissions:
      contents: write # Required to create the release and tag

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x' # Ensure this matches your project (6.x, 7.x, or 8.x)

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build and Publish
        run: dotnet publish -c Release -r win-x64 --self-contained false -o ./publish

      - name: Zip Build Output
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath "./${{ env.ZIP_FILE }}"

      - name: Create Release
        id: gh_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          files: ./${{ env.ZIP_FILE }}
          generate_release_notes: true

      - name: Generate latest-release.md
        shell: pwsh
        run: |
          $release_url = "https://github.com/${{ env.REPO }}/releases/tag/${{ env.VERSION }}"
          $zip_url = "https://github.com/${{ env.REPO }}/releases/download/${{ env.VERSION }}/${{ env.ZIP_FILE }}"
          $commits = git log -n 5 --pretty=format:"- %h %s by %an"  # last 5 commits
          
          $content = @"
# Latest Release - ${{ env.VERSION }}

**Release Tag:** [${{ env.VERSION }}]($release_url)  
**File Name:** [${{ env.ZIP_FILE }}]($zip_url)  
**Release Notes:** See release page for full notes.  

## Last Commits
$commits

## Installation
1. Download the [zip file]($zip_url)
2. Extract contents
3. Run `Star-Resonance-Dps.exe` (Windows)  

## Action
This release was created automatically via GitHub Actions.
"@

          $content | Out-File -FilePath latest-release.md -Encoding UTF8
          
      - name: Commit latest-release.md
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update latest-release.md for ${{ env.VERSION }}"
          file_pattern: latest-release.md
          branch: nOrMaL
