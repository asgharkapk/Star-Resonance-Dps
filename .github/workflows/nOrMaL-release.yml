name: nOrMaL Auto Release

on:
  push:
    branches:
      - nOrMaL   # Trigger on push to normal
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  build-and-release:
    runs-on: windows-latest
    
    env:
      REPO: ${{ github.repository }}

    permissions:
      contents: write # Required to create the release and tag

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Version by DateTime
        id: set_version
        shell: pwsh
        run: |
          $dt = Get-Date -Format "yyyyMMdd-HHmmss"
          $version = "v$dt-nOrMaL"
          echo "VERSION=$version" >> $GITHUB_ENV
          # Use Out-File to reliably set step output on Windows
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create Tag
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $env:VERSION
          git push origin $env:VERSION

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build and Publish
        run: dotnet publish -c Release -r win-x64 --self-contained false -o ./publish

      - name: Zip Build Output
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath "./Star-Resonance-Dps-$env:VERSION.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.set_version.outputs.version }}
          name: BPSR DPS Details Release ${{ steps.set_version.outputs.version }}
          files: ./Star-Resonance-Dps-${{ steps.set_version.outputs.version }}.zip
          generate_release_notes: true

      - name: Generate latest-release.md
        shell: pwsh
        run: |
          $release_url = "https://github.com/$($env:REPO)/releases/tag/$($env:VERSION)"
          $zip_url = "https://github.com/$($env:REPO)/releases/download/$($env:VERSION)/Star-Resonance-Dps-$($env:VERSION).zip"
          $commits = git log -n 5 --pretty=format:'- %h %s by %an'  # last 5 commits

          $lines = @(
            "# Latest Release - $($env:VERSION)"
            ""
            "**Release Tag:** [$($env:VERSION)]($release_url)"
            "**File Name:** [Star-Resonance-Dps-$($env:VERSION).zip]($zip_url)"
            "**Release Notes:** See release page for full notes."
            ""
            "## Last Commits"
            "$commits"
            ""
            "## Installation"
            "1. Download the [zip file]($zip_url)"
            "2. Extract contents"
            "3. Run `Star-Resonance-Dps.exe` (Windows)"
            ""
            "## Action"
            "This release was created automatically via GitHub Actions."
          )

          $lines | Out-File -FilePath latest-release.md -Encoding UTF8

      - name: Commit latest-release.md
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update latest-release.md for ${{ steps.set_version.outputs.version }}"
          file_pattern: latest-release.md
          branch: nOrMaL
