name: SELECTOR Auto README

on:
  push:
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    
    permissions:
      contents: write

    ### 1. Checkout with full history
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0   # full history
      
      ### 2. Fetch the other branches
    - name: Fetch all branches
      run: git fetch --all    

    ### 3. Collect the latest-release.md files
    - name: Collect release notes
      run: |
        mkdir releases
        git show cOmPaCt:latest-release.md > releases/branch1.md
        git show nOrMaL:latest-release.md > releases/branch2.md
        git show mOnStEr:latest-release.md > releases/branch3.md
        git show فارسی:latest-release.md > releases/branch4.md

    ### 4. Merge them into a summary
    - name: Create summary file
      run: |
        echo "# Branches Release Summary" > branches-release-summary.md
        for f in releases/*.md; do
          echo -e "\n## $(basename $f .md)\n" >> branches-release-summary.md
          cat $f >> branches-release-summary.md
        done

    ### 5. Commit to main
    - name: Commit summary to main
      run: |
        git checkout main
        mv branches-release-summary.md .
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        git add branches-release-summary.md
        git commit -m "Update branches release summary"
        git push origin main

