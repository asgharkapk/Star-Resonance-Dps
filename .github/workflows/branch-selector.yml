name: SELECTOR Auto README

on:
  push:
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    
    permissions:
      contents: write

    ### 1. Checkout with full history
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0   # full history
      
      ### 2. Fetch the other branches
    - name: Fetch all branches
      run: git fetch --all    

    ### 3. Collect the latest-release.md files
    - name: Collect release notes
      shell: bash
      run: |
        mkdir -p releases

        git show origin/cOmPaCt:latest-release.md > releases/cOmPaCt.md || echo "_No release yet_" > releases/cOmPaCt.md
        git show origin/nOrMaL:latest-release.md > releases/nOrMaL.md
        git show origin/mOnStEr:latest-release.md > releases/mOnStEr.md
        git show origin/فارسی:latest-release.md > releases/فارسی.md

    ### 4. Merge them into a summary
    - name: Create summary file
      shell: bash
      run: |
        echo "# Branches Release Summary" > branches-release-summary.md
        for f in releases/*.md; do
          echo -e "\n## $(basename "$f" .md)\n" >> branches-release-summary.md
          cat "$f" >> branches-release-summary.md
        done

    ### 5. Commit to main
    - name: Commit summary to main
      run: |
        git checkout main
        mv branches-release-summary.md .
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        git add branches-release-summary.md
        git commit -m "Update branches release summary"
        git push origin main

