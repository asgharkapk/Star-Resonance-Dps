name: فارسی انتشار خودکار

on:
  push:
    branches:
      - فارسی   # فعال شدن هنگام push به شاخه فارسی
  workflow_dispatch: # اجازه اجرای دستی

jobs:
  build-and-release:
    runs-on: windows-latest

    permissions:
      contents: write # مورد نیاز برای ایجاد ریلیز و تگ

    steps:
      - name: بررسی کد (Checkout Code)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # مورد نیاز برای تگ‌گذاری

      - name: Fetch all branches
        shell: bash
        run: |
          echo "::group::Fetching branches"
          git fetch --all --prune
          echo "::notice::Remote branches:"
          git branch -r
          echo "::endgroup::"

      - name: تعیین نسخه بر اساس تاریخ و زمان
        id: set_version
        shell: pwsh
        run: |
          Write-Host "تعیین نسخه بر اساس تاریخ و زمان فعلی..."
          $dt = Get-Date -Format "yyyyMMdd-HHmmss"
          $version = "v$dt-فارسی"
          Write-Host "نسخه تولید شده: $version"
          
          # صادر کردن به عنوان متغیر محیطی برای این Job
          echo "VERSION=$version" >> $GITHUB_ENV
          
          # تعیین خروجی مرحله برای ارجاع بعدی
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8

      - name: ایجاد تگ
        shell: pwsh
        run: |
          Write-Host "پیکربندی کاربر Git..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch --prune --unshallow
          git fetch --tags

          $tag = '${{ steps.set_version.outputs.version }}'
          Write-Host "ایجاد تگ Git $tag..."
          git tag $tag
          Write-Host "ارسال تگ Git $tag به origin..."
          git push origin $tag
          Write-Host "تگ با موفقیت ارسال شد."

      - name: نصب .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: بازگردانی وابستگی‌ها
        run: dotnet restore

      - name: ساخت و انتشار
        run: dotnet publish -c Release -r win-x64 --self-contained false -o ./publish

      - name: فشرده‌سازی خروجی ساخت
        shell: pwsh
        run: |
          $version = '${{ steps.set_version.outputs.version }}'
          $zipPath = "./Star-Resonance-Dps-$version.zip"
          Write-Host "فشرده‌سازی خروجی ساخت در $zipPath..."
          Compress-Archive -Path ./publish/* -DestinationPath $zipPath
          Write-Host "فایل zip ایجاد شد: $zipPath"

      - name: ایجاد ریلیز
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.set_version.outputs.version }}
          name: Release ${{ steps.set_version.outputs.version }}
          files: ./Star-Resonance-Dps-${{ steps.set_version.outputs.version }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ثبت لاگ ایجاد ریلیز
        shell: pwsh
        run: |
          $version = '${{ steps.set_version.outputs.version }}'
          Write-Host "درخواست ایجاد ریلیز برای تگ: $version"
          Write-Host "فایل ریلیز: Star-Resonance-Dps-$version.zip"

      - name: تولید فایل latest-release.md
        shell: pwsh
        run: |
          $version = '${{ steps.set_version.outputs.version }}'
          $repo = '${{ github.repository }}'
          $release_url = "https://github.com/$repo/releases/tag/$version"
          $zip_url = "https://github.com/$repo/releases/download/$version/Star-Resonance-Dps-$version.zip"

          $commits = git log -n 5 --pretty=format:'- %h %s توسط %an'

          $lines = @(
            "# آخرین ریلیز - $version"
            ""
            "**تگ ریلیز:** [$version]($release_url)"
            "**نام فایل:** [Star-Resonance-Dps-$version.zip]($zip_url)"
            "**یادداشت‌های ریلیز:** برای مشاهده کامل یادداشت‌ها به صفحه ریلیز مراجعه کنید."
            ""
            "## آخرین کامیت‌ها"
            "$commits"
            ""
            "## نصب"
            "1. دانلود [فایل zip]($zip_url)"
            "2. استخراج محتویات"
            "3. اجرای `Star-Resonance-Dps.exe` (ویندوز)"
            ""
            "## اکشن"
            "این ریلیز به صورت خودکار توسط GitHub Actions ایجاد شده است."
          )

          $lines | Out-File -FilePath latest-release.md -Encoding UTF8
          Write-Host "latest-release.md با موفقیت تولید شد"

      - name: کامیت کردن latest-release.md
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "به‌روزرسانی latest-release.md برای ${{ steps.set_version.outputs.version }}"
          file_pattern: latest-release.md
          branch: فارسی

      - name: ثبت لاگ کامیت
        shell: pwsh
        run: |
          $version = '${{ steps.set_version.outputs.version }}'
          Write-Host "latest-release.md به شاخه فارسی کامیت شد"
          Write-Host "پیام کامیت: به‌روزرسانی latest-release.md برای $version"

      - name: Push latest-فارسی-version.md to BRANCH_SELECTOR
        shell: pwsh
        run: |
          $branch = 'BRANCH_SELECTOR'
          $version = '${{ steps.set_version.outputs.version }}'
          $filePath = "latest-فارسی-version.md"

          Write-Host "=== شروع ساخت فایل $filePath برای شاخه $branch ==="

          # Create file
          $content = @"
          نسخه خودکار فارسی: $version
          تاریخ: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss")
          "@
          $content | Out-File -FilePath $filePath -Encoding UTF8
          Write-Host "فایل $filePath ایجاد شد:"
          Get-Content $filePath | ForEach-Object { Write-Host $_ }

          # Configure Git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          Write-Host "Git پیکربندی شد: $(git config user.name) / $(git config user.email)"

          # Fetch and checkout the target branch safely
          Write-Host "دریافت شاخه $branch از origin..."
          git fetch origin $branch
          
          if (git show-ref --verify --quiet "refs/heads/$branch") {
              Write-Host "سوئیچ به شاخه موجود $branch..."
              git checkout $branch
          } else {
              Write-Host "شاخه $branch وجود ندارد، ایجاد شاخه محلی جدید..."
              git checkout -b $branch
          }

          # Add and commit
          Write-Host "اضافه کردن فایل $filePath به Git..."
          git add $filePath
          $commitOutput = git commit -m "Trigger BRANCH_SELECTOR workflow: $version" -m "Generated by فارسی workflow" 2>&1
          if ($LASTEXITCODE -eq 0) {
              Write-Host "کامیت با موفقیت ایجاد شد:"
              Write-Host $commitOutput
          } else {
              Write-Host "هیچ تغییر جدیدی برای کامیت وجود ندارد."
              Write-Host $commitOutput
          }

          # Push
          Write-Host "ارسال تغییرات به شاخه $branch در remote..."
          $pushOutput = git push origin $branch 2>&1
          if ($LASTEXITCODE -eq 0) {
              Write-Host "پوش به شاخه $branch با موفقیت انجام شد."
          } else {
              Write-Host "خطا هنگام پوش:"
              Write-Host $pushOutput
              exit 1
          }
          Write-Host "=== اتمام فرآیند push برای $filePath ==="
